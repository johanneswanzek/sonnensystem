# E2E-Tests (Playwright) bei jedem Push. Blockiert nichts: pages.yml läuft unabhängig davon.
name: E2E-Tests

on:
  push:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: e2e-${{ github.ref }}
  cancel-in-progress: true

jobs:
  e2e:
    runs-on: ubuntu-latest
    continue-on-error: true          # nicht blockierend
    timeout-minutes: 60
    env:
      SOFTWARE_GL: "1"               # keine Grafikkarte auf dem Runner
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Abhängigkeiten und Chromium
        working-directory: tools/test
        run: |
          npm install
          npx playwright install --with-deps chromium
      - name: E2E-Suite
        working-directory: tools/test
        run: npm test
      - name: Bericht sichern
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            tools/test/playwright-report/
            tools/test/test-results/
          retention-days: 7
