# Prüft jeden Push und jeden Pull Request: Lint, Typen, Unit-Tests, Bau (Website und Artefakt), E2E mit Playwright.
# Die E2E-Tests bauen die Testseite selbst (playwright.config.js: webServer -> npm run build:test, tools/shots/serve.mjs).
# Veröffentlicht wird nicht hier, sondern in pages.yml.
# Voraussetzung: package-lock.json ist eingecheckt (für npm ci) und .nvmrc nennt die Node-Version.
name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pruefen:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      SOFTWARE_GL: "1"   # keine Grafikkarte auf dem Runner
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run format:check
      - run: npm run typecheck
      - run: npm run test:unit
      - run: npm run build
      - run: npm run build:artifact
      - name: Chromium für Playwright installieren
        run: npx playwright install --with-deps chromium
      - name: E2E-Tests
        run: npm run test:e2e
      - name: Berichte hochladen
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: e2e-berichte
          path: |
            playwright-report/
            test-results/
            .shots/
          if-no-files-found: ignore
          retention-days: 14
